# ============================================================
# SEM Dashboard v6.1 — Solar Energy Management
# ============================================================
# Version: 6.1 (2026-04)
#
# 7 views: Home, Energy, Battery, EV, Control, Costs, System
# Dark glassmorphism theme, mobile-first responsive design
#
# Required HACS cards (only 5):
#   mushroom         — chips, entity, template, number, title cards
#   card-mod         — *glass_card YAML anchor for unified styling
#   apexcharts-card  — all trend / power / cost charts
#   sankey-chart     — Energy flow diagram on Energy tab
#   fold-entity-row  — collapsible Welcome intro on Home tab
#
# Bundled SEM cards (auto-registered, no HACS needed):
#   sem-flow-card            — animated power flow with daily energy, autarky, config editor
#   sem-system-diagram-card  — animated power flow diagram (legacy, kept for compat)
#   sem-solar-summary-card   — solar yield summary
#   sem-weather-card         — weather + clock header
#   sem-chart-card           — cost / savings charts
#   sem-period-selector-card — period selector for Costs tab
#   sem-load-priority-card   — drag-and-drop device priority (inlined SortableJS)
#
# Removed in v2.6.x (replaced by bundled SEM cards or native HA):
#   power-flow-card-plus → sem-system-diagram-card → sem-flow-card
#   mini-graph-card      → apexcharts-card
#   solar-card           → sem-solar-summary-card
#   clock-weather-card   → sem-weather-card
#   bar-card             → native HA gauge
#   bubble-card, button-card → mushroom standardization
# ============================================================

title: Solar Energy Management
views:
  # ============================================================
  # VIEW 0: HOME — At-a-glance power flow & status
  # ============================================================
  - title: Home
    path: home
    icon: mdi:home-lightning-bolt
    type: panel
    cards:
      - type: vertical-stack
        cards:
          # ── Lumina Tab Header ──
          - type: custom:sem-tab-header
            tab: home

          # ── Home Status Card ──
          - type: custom:sem-home-status-card
            entity_prefix: sensor.sem_

          # ── Flow Card (full width) — &glass_card anchor defined here ──
          - type: custom:sem-flow-card
            entity_prefix: sensor.sem_
            card_mod:
              style: &glass_card |
                ha-card {
                  background-color: var(--card-background-color) !important;
                  color: var(--primary-text-color) !important;
                  border: 1px solid var(--divider-color) !important;
                  border-radius: 16px !important;
                  box-shadow: var(--ha-card-box-shadow, 0 2px 8px rgba(0,0,0,0.08)) !important;
                  max-width: 900px !important;
                  font-family: 'Segoe UI','Roboto',sans-serif !important;
                  transition: box-shadow 0.3s cubic-bezier(0.4,0,0.2,1), border-color 0.3s cubic-bezier(0.4,0,0.2,1) !important;
                  --chip-background: var(--secondary-background-color);
                  --primary-font-family: 'Segoe UI','Roboto',sans-serif;
                }
                ha-card:hover {
                  box-shadow: var(--ha-card-box-shadow, 0 4px 16px rgba(0,0,0,0.12)) !important;
                }

          # ── Solar Summary ──
          - type: custom:sem-solar-card
            entity_prefix: sensor.sem_
            card_mod:
              style: *glass_card

          # ── Weather & Clock ──
          - type: custom:sem-weather-card
            entity: weather.home
            card_mod:
              style: *glass_card

          # ── 7-Day Summary ──
          - type: custom:apexcharts-card
            header:
              title: Last 7 Days
              show: true
            graph_span: 7d
            span:
              end: day
            apex_config:
              chart:
                height: 160
                stacked: false
                background: transparent
                foreColor: var(--primary-text-color)
              grid:
                borderColor: "var(--divider-color, rgba(255,255,255,0.06))"
              legend:
                show: true
                position: top
                labels:
                  colors: var(--secondary-text-color)
              plotOptions:
                bar:
                  columnWidth: 55%
              tooltip:
                theme: dark
                x:
                  format: ddd dd MMM
              yaxis:
                - title:
                    text: kWh
                    style:
                      color: "var(--secondary-text-color, #757575)"
                  decimalsInFloat: 1
                  labels:
                    style:
                      colors: var(--secondary-text-color)
            series:
              - entity: sensor.sem_daily_solar_energy
                name: Solar
                type: column
                color: "#ff9800"
                statistics:
                  type: state
                  period: day
                group_by:
                  func: max
                  duration: 1d
              - entity: sensor.sem_daily_home_energy
                name: House
                type: column
                color: "#5BC8D8"
                statistics:
                  type: state
                  period: day
                group_by:
                  func: max
                  duration: 1d
              - entity: sensor.sem_daily_grid_import_energy
                name: Grid
                type: column
                color: "#488fc2"
                statistics:
                  type: state
                  period: day
                group_by:
                  func: max
                  duration: 1d
            card_mod:
              style: *glass_card

          # power-sources-graph removed — redundant with system diagram + 7-day chart

  # ============================================================
  # VIEW 1: ENERGY — Sankey, charts, daily breakdown
  # ============================================================
  - title: Energy
    path: energy
    icon: mdi:lightning-bolt
    type: panel
    cards:
      - type: vertical-stack
        cards:
          - type: custom:sem-tab-header
            tab: energy
          # ── Sankey Energy Flow ──
          - type: custom:sankey-chart
            show_names: true
            show_icons: true
            show_states: true
            wide: true
            height: 280
            unit_prefix: k
            round: 2
            sections:
              - entities:
                  - entity_id: sensor.sem_daily_solar_energy
                    color: "#ff9800"
                    name: Solar
                    children:
                      - sensor.sem_flow_solar_to_home_energy
                      - sensor.sem_flow_solar_to_ev_energy
                      - sensor.sem_flow_solar_to_battery_energy
                      - sensor.sem_flow_solar_to_grid_energy
                  - entity_id: sensor.sem_daily_grid_import_energy
                    color: "#488fc2"
                    name: Grid
                    children:
                      - sensor.sem_flow_grid_to_home_energy
                      - sensor.sem_flow_grid_to_ev_energy
                      - sensor.sem_flow_grid_to_battery_energy
                  - entity_id: sensor.sem_daily_battery_discharge_energy
                    color: "#4db6ac"
                    name: Battery
                    children:
                      - sensor.sem_flow_battery_to_home_energy
                      - sensor.sem_flow_battery_to_ev_energy
              - entities:
                  - entity_id: sensor.sem_flow_solar_to_home_energy
                    color: "#ff9800"
                    name: Sol>Home
                    children:
                      - sensor.sem_daily_home_energy
                  - entity_id: sensor.sem_flow_solar_to_ev_energy
                    color: "#ff9800"
                    name: Sol>EV
                    children:
                      - sensor.sem_daily_ev_energy
                  - entity_id: sensor.sem_flow_solar_to_battery_energy
                    color: "#ff9800"
                    name: Sol>Bat
                    children:
                      - sensor.sem_daily_battery_charge_energy
                  - entity_id: sensor.sem_flow_solar_to_grid_energy
                    color: "#ff9800"
                    name: Sol>Grid
                    children:
                      - sensor.sem_daily_grid_export_energy
                  - entity_id: sensor.sem_flow_grid_to_home_energy
                    color: "#488fc2"
                    name: Grid>Home
                    children:
                      - sensor.sem_daily_home_energy
                  - entity_id: sensor.sem_flow_grid_to_ev_energy
                    color: "#488fc2"
                    name: Grid>EV
                    children:
                      - sensor.sem_daily_ev_energy
                  - entity_id: sensor.sem_flow_grid_to_battery_energy
                    color: "#488fc2"
                    name: Grid>Bat
                    children:
                      - sensor.sem_daily_battery_charge_energy
                  - entity_id: sensor.sem_flow_battery_to_home_energy
                    color: "#4db6ac"
                    name: Bat>Home
                    children:
                      - sensor.sem_daily_home_energy
                  - entity_id: sensor.sem_flow_battery_to_ev_energy
                    color: "#4db6ac"
                    name: Bat>EV
                    children:
                      - sensor.sem_daily_ev_energy
              - entities:
                  - entity_id: sensor.sem_daily_home_energy
                    color: "#5BC8D8"
                    name: House
                  - entity_id: sensor.sem_daily_ev_energy
                    color: "#8DC892"
                    name: EV
                  - entity_id: sensor.sem_daily_battery_charge_energy
                    color: "#f06292"
                    name: Battery
                  - entity_id: sensor.sem_daily_grid_export_energy
                    color: "#8353d1"
                    name: Export
            card_mod:
              style: *glass_card

          # ── Self-Consumption & Autarky Gauges (moved from Overview) ──
          - type: horizontal-stack
            cards:
              - type: gauge
                entity: sensor.sem_self_consumption_rate
                name: Self-consumption
                min: 0
                max: 100
                severity:
                  green: 75
                  yellow: 50
                  red: 0
                card_mod:
                  style: *glass_card
              - type: gauge
                entity: sensor.sem_autarky_rate
                name: Autarky
                min: 0
                max: 100
                severity:
                  green: 80
                  yellow: 60
                  red: 0
                card_mod:
                  style: *glass_card

          # ── Energy Distribution Donut ──
          - type: custom:apexcharts-card
            header:
              title: Today's Energy Distribution
              show: true
            chart_type: donut
            series:
              - entity: sensor.sem_flow_solar_to_home_energy
                name: Solar > Home
                color: "#ff9800"
                float_precision: 1
              - entity: sensor.sem_flow_grid_to_home_energy
                name: Grid > Home
                color: "#488fc2"
                float_precision: 1
              - entity: sensor.sem_flow_battery_to_home_energy
                name: Battery > Home
                color: "#4db6ac"
                float_precision: 1
              - entity: sensor.sem_daily_ev_energy
                name: EV Charging
                color: "#8DC892"
                float_precision: 1
              - entity: sensor.sem_daily_grid_export_energy
                name: Export
                color: "#8353d1"
                float_precision: 1
            apex_config:
              chart:
                height: 260
                background: transparent
                foreColor: var(--primary-text-color)
              legend:
                show: true
                position: bottom
                labels:
                  colors: var(--secondary-text-color)
              dataLabels:
                enabled: false
              tooltip:
                theme: dark
              plotOptions:
                pie:
                  donut:
                    size: "65%"
                    labels:
                      show: true
                      total:
                        show: true
                        label: Total
                        color: var(--secondary-text-color)
                        formatter: |
                          EVAL:function(w) { return w.globals.seriesTotals.reduce(function(a,b){return a+b},0).toFixed(1); }
                      value:
                        color: var(--primary-text-color)
                        formatter: |
                          EVAL:function(val) { return parseFloat(val).toFixed(1); }
            card_mod:
              style: *glass_card

          # ── 24h Power Curves ──
          - type: custom:apexcharts-card
            header:
              title: 24h Power
              show: true
            graph_span: 24h
            series:
              - entity: sensor.sem_solar_power
                name: Solar
                color: "#ff9800"
                type: area
                opacity: 0.3
                stroke_width: 2
                group_by:
                  func: avg
                  duration: 5m
              - entity: sensor.sem_home_consumption_power
                name: House
                color: "#5BC8D8"
                type: line
                stroke_width: 2
                group_by:
                  func: avg
                  duration: 5m
              - entity: sensor.sem_grid_power
                name: Grid
                color: "#488fc2"
                type: line
                stroke_width: 1
                group_by:
                  func: avg
                  duration: 5m
            apex_config:
              chart:
                height: 200
                background: transparent
                foreColor: var(--primary-text-color)
              grid:
                borderColor: "var(--divider-color, rgba(255,255,255,0.06))"
              yaxis:
                - title:
                    text: Watts
                    style:
                      color: "var(--secondary-text-color, #757575)"
                  decimalsInFloat: 0
                  labels:
                    style:
                      colors: var(--secondary-text-color)
              tooltip:
                theme: dark
                x:
                  format: HH:mm
              legend:
                labels:
                  colors: var(--secondary-text-color)
            card_mod:
              style: *glass_card

          # ── Today vs Yesterday Solar ──
          - type: custom:apexcharts-card
            header:
              title: Solar — Today vs Yesterday
              show: true
            graph_span: 24h
            span:
              start: day
            series:
              - entity: sensor.sem_solar_power
                name: Today
                color: "#ff9800"
                type: area
                opacity: 0.3
                stroke_width: 2
                group_by:
                  func: avg
                  duration: 10m
              - entity: sensor.sem_solar_power
                name: Yesterday
                color: "var(--secondary-text-color, #999)"
                type: line
                stroke_width: 1
                opacity: 0.6
                offset: "-1d"
                group_by:
                  func: avg
                  duration: 10m
            apex_config:
              chart:
                height: 200
                background: transparent
                foreColor: var(--primary-text-color)
              grid:
                borderColor: "var(--divider-color, rgba(255,255,255,0.06))"
              yaxis:
                - title:
                    text: Watts
                    style:
                      color: "var(--secondary-text-color, #757575)"
                  decimalsInFloat: 0
                  labels:
                    style:
                      colors: var(--secondary-text-color)
              tooltip:
                theme: dark
                x:
                  format: HH:mm
              legend:
                labels:
                  colors: var(--secondary-text-color)
            card_mod:
              style: *glass_card

          # ── Energy Impact Card ──
          - type: custom:sem-energy-impact-card
            entity_prefix: sensor.sem_

          # ── Self-Consumption Trend (30 days) ──
          - type: custom:apexcharts-card
            header:
              title: Self-Consumption — 30 Day Trend
              show: true
            graph_span: 30d
            span:
              end: day
            apex_config:
              chart:
                height: 160
                background: transparent
                foreColor: var(--primary-text-color)
              grid:
                borderColor: "var(--divider-color, rgba(255,255,255,0.06))"
              yaxis:
                - title:
                    text: "%"
                    style:
                      color: "var(--secondary-text-color, #757575)"
                  min: 0
                  max: 100
                  decimalsInFloat: 0
                  labels:
                    style:
                      colors: var(--secondary-text-color)
              tooltip:
                theme: dark
                x:
                  format: dd MMM
              legend:
                labels:
                  colors: var(--secondary-text-color)
            series:
              - entity: sensor.sem_self_consumption_rate
                name: Self-consumption
                type: area
                color: "#ff9800"
                opacity: 0.3
                stroke_width: 2
                statistics:
                  type: mean
                  period: day
                group_by:
                  func: avg
                  duration: 1d
              - entity: sensor.sem_autarky_rate
                name: Autarky
                type: line
                color: "#5BC8D8"
                stroke_width: 2
                statistics:
                  type: mean
                  period: day
                group_by:
                  func: avg
                  duration: 1d
            card_mod:
              style: *glass_card

          # ── Monthly Trends ──
          - type: custom:apexcharts-card
            header:
              title: 30-Day Energy
              show: true
            graph_span: 30d
            series:
              - entity: sensor.sem_solar_power
                name: Solar
                color: "#ff9800"
                type: column
                statistics:
                  type: max
                  period: day
                group_by:
                  func: max
                  duration: 1d
              - entity: sensor.sem_home_consumption_power
                name: House
                color: "#5BC8D8"
                type: column
                statistics:
                  type: max
                  period: day
                group_by:
                  func: max
                  duration: 1d
            apex_config:
              chart:
                height: 200
                stacked: false
                background: transparent
                foreColor: var(--primary-text-color)
              grid:
                borderColor: "var(--divider-color, rgba(255,255,255,0.06))"
              plotOptions:
                bar:
                  columnWidth: 60%
              tooltip:
                theme: dark
                x:
                  format: dd MMM
              legend:
                labels:
                  colors: var(--secondary-text-color)
            card_mod:
              style: *glass_card

  # ============================================================
  # VIEW 2: BATTERY — SOC zones, charge/discharge, health
  # ============================================================
  - title: Battery
    path: battery
    icon: mdi:battery-charging-80
    type: panel
    cards:
      - type: vertical-stack
        cards:
          - type: custom:sem-tab-header
            tab: battery
          # ── Battery Hero (Lumina) ──
          - type: custom:sem-battery-card
            entity_prefix: sensor.sem_

          # ── Battery 24h Chart (charge/discharge + SOC) ──
          - type: custom:apexcharts-card
            header:
              title: Battery 24h
              show: true
            graph_span: 24h
            series:
              - entity: sensor.sem_battery_power
                name: Power
                color: "#4db6ac"
                type: area
                opacity: 0.3
                stroke_width: 2
                group_by:
                  func: avg
                  duration: 5m
              - entity: sensor.sem_battery_soc
                name: SOC
                color: "#5BC8D8"
                type: line
                stroke_width: 2
                group_by:
                  func: avg
                  duration: 5m
                yaxis_id: soc
            apex_config:
              chart:
                height: 200
                background: transparent
                foreColor: var(--primary-text-color)
              grid:
                borderColor: "var(--divider-color, rgba(255,255,255,0.06))"
              yaxis:
                - title:
                    text: Watts
                    style:
                      color: var(--secondary-text-color)
                  seriesName: Power
                  decimalsInFloat: 0
                  labels:
                    style:
                      colors: var(--secondary-text-color)
                - id: soc
                  opposite: true
                  title:
                    text: SOC %
                    style:
                      color: "#5BC8D8"
                  seriesName: SOC
                  min: 0
                  max: 100
                  decimalsInFloat: 0
                  labels:
                    style:
                      colors: "#5BC8D8"
              xaxis:
                labels:
                  style:
                    colors: var(--secondary-text-color)
              tooltip:
                theme: dark
                x:
                  format: HH:mm
              legend:
                labels:
                  colors: var(--secondary-text-color)
              annotations:
                yaxis:
                  - y: 0
                    borderColor: "var(--divider-color, rgba(255,255,255,0.1))"
                    strokeDashArray: 4
            card_mod:
              style: *glass_card

          # ── SOC Zone Settings ──
          - type: custom:sem-battery-zones-card

  # ============================================================
  # VIEW 3: EV — Charging session, lifetime, schedule
  # ============================================================
  - title: EV
    path: ev
    icon: mdi:car-electric
    type: panel
    cards:
      - type: vertical-stack
        cards:
          - type: custom:sem-tab-header
            tab: ev
          # ── EV Hero (Lumina) ──
          - type: custom:sem-ev-status-card
            entity_prefix: sensor.sem_

          # ── Vehicle SOC (conditional — only when car API provides SOC) ──
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.sem_vehicle_soc
                state_not: unavailable
              - condition: state
                entity: sensor.sem_vehicle_soc
                state_not: unknown
            card:
              type: gauge
              entity: sensor.sem_vehicle_soc
              name: Vehicle Battery
              min: 0
              max: 100
              needle: true
              severity:
                green: 60
                yellow: 30
                red: 0
              card_mod:
                style: *glass_card

          # ── EV Power Chart (source breakdown) ──
          - type: custom:apexcharts-card
            header:
              title: EV Charging Power
              show: true
            graph_span: 24h
            stacked: true
            series:
              - entity: sensor.sem_flow_solar_to_ev_power
                name: Solar
                color: "#ff9800"
                type: area
                opacity: 0.5
                stroke_width: 1
                group_by:
                  func: avg
                  duration: 5m
              - entity: sensor.sem_flow_battery_to_ev_power
                name: Battery
                color: "#4db6ac"
                type: area
                opacity: 0.4
                stroke_width: 1
                group_by:
                  func: avg
                  duration: 5m
              - entity: sensor.sem_flow_grid_to_ev_power
                name: Grid
                color: "#488fc2"
                type: area
                opacity: 0.4
                stroke_width: 1
                group_by:
                  func: avg
                  duration: 5m
            apex_config:
              chart:
                height: 200
                background: transparent
                foreColor: var(--primary-text-color)
                stacked: true
              grid:
                borderColor: "var(--divider-color, rgba(255,255,255,0.06))"
              tooltip:
                theme: dark
                x:
                  format: HH:mm
              legend:
                labels:
                  colors: var(--secondary-text-color)
            card_mod:
              style: *glass_card

          # ── EV Intelligence + Charging Settings ──
          # Handled by sem-ev-status-card per-charger sections (#193)
          # The card shows SOC gauge, charge tonight, nights until charge,
          # night charging toggle, target kWh, and amps for every charger.

          # ── EV Progress Card (daily progress + lifetime stats) ──
          - type: custom:sem-ev-progress-card
            entity_prefix: sensor.sem_

  # ============================================================
  # VIEW 4: CONTROL — Settings & device management
  # ============================================================
  - title: Control
    path: control
    icon: mdi:tune-vertical
    type: panel
    cards:
      - type: vertical-stack
        cards:
          - type: custom:sem-tab-header
            tab: control
          # ── Consolidated Control Card ──
          # Replaces all mushroom cards with a single interactive card
          # featuring collapsible sections, toggles, steppers, and selects
          - type: custom:sem-control-card
            entity_prefix: sensor.sem_

          # ── Schedule Timeline ──
          - type: custom:sem-title-card
            title: Today's Schedule
            subtitle: Tariff windows · Night charging · Surplus forecast
          - type: custom:sem-schedule-card
            entity_prefix: sensor.sem_

          # ── Load Priority (drag-and-drop device management) ──
          - type: custom:sem-title-card
            title: Load Management
            subtitle: Device priority
          - type: custom:sem-load-priority-card
            entity_prefix: sensor.sem_

  # ============================================================
  # VIEW 5: COSTS — Financial tracking
  # ============================================================
  - title: Costs
    path: costs
    icon: mdi:cash-multiple
    type: panel
    cards:
      - type: vertical-stack
        cards:
          - type: custom:sem-tab-header
            tab: costs

          # ══════════════════════════════════════════════════════
          # 0. CONSOLIDATED COSTS CARD
          # ══════════════════════════════════════════════════════
          - type: custom:sem-costs-card

          # ══════════════════════════════════════════════════════
          # 1. PERIOD SELECTOR
          # ══════════════════════════════════════════════════════
          - type: custom:sem-period-selector-card
            default_period: week
            card_mod:
              style: *glass_card

          # ══════════════════════════════════════════════════════
          # 3. COSTS CHART (reacts to period selector)
          # ══════════════════════════════════════════════════════
          - type: custom:sem-chart-card
            preset: costs
            card_mod:
              style: *glass_card

          # ══════════════════════════════════════════════════════
          # 3. SAVINGS CHART (reacts to period selector)
          # ══════════════════════════════════════════════════════
          - type: custom:sem-chart-card
            preset: savings
            card_mod:
              style: *glass_card

          # ══════════════════════════════════════════════════════
          # 6. COSTS DETAIL CARD
          # ══════════════════════════════════════════════════════
          - type: custom:sem-costs-detail-card
            entity_prefix: sensor.sem_

  # ============================================================
  # VIEW 6: SYSTEM HEALTH — Diagnostics & debug
  # ============================================================
  - title: System
    path: system
    icon: mdi:heart-pulse
    type: panel
    cards:
      - type: vertical-stack
        cards:
          - type: custom:sem-tab-header
            tab: system

          # ══════════════════════════════════════════════════════
          # 0. SYSTEM CARD — health, diagnostics, quick actions
          # ══════════════════════════════════════════════════════
          - type: custom:sem-system-card
            entity_prefix: sensor.sem_

          # ══════════════════════════════════════════════════════
          # 1b. GRID CARD
          # ══════════════════════════════════════════════════════
          - type: custom:sem-grid-card

          # ══════════════════════════════════════════════════════
          # 3. FORECAST SPARKLINE
          # ══════════════════════════════════════════════════════
          - type: custom:apexcharts-card
            header:
              title: Forecast vs Actual
              show: true
            graph_span: 24h
            series:
              - entity: sensor.sem_forecast_power_now_w
                name: Forecast
                color: "#ff9800"
                type: area
                opacity: 0.3
                stroke_width: 2
                group_by:
                  func: avg
                  duration: 15min
              - entity: sensor.sem_solar_power
                name: Actual
                color: "#4db6ac"
                type: line
                stroke_width: 2
                group_by:
                  func: avg
                  duration: 15min
            apex_config:
              chart:
                height: 160
              legend:
                show: true
            card_mod:
              style: *glass_card
