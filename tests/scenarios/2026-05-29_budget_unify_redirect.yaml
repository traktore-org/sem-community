name: "2026-05-29 budget unification — redirect-only regime (Phase C)"
description: |
  Phase C scenario for the #282 EV-budget unification. Replays the
  regime where the three legacy paths historically diverged: solar is
  modest, the battery is charging, SOC is just above the buffer (Zone
  3), and the forecast says there's far more solar coming than the
  battery still needs. The forecast-aware redirect was supposed to
  divert some battery-charge to the EV in this regime.

  Live evidence captured 2026-05-29 (PROD trace): solar=2025 W,
  home=100 W, batt_charge=1900 W, batt_soc=36 %.
    - Legacy B2 (state machine input) read ``ev_budget = surplus +
      redirect`` → ctx.calculated_current ≈ 3 A.
    - Legacy B3 (actuator) read ``budget_w = solar - home - batt_charge``
      WITHOUT redirect → 25 W → 0 A.
    - Legacy B1 (published sensors) read from B1's surplus formula too.

  After Phase B unification, the SOLAR_ONLY canonical strategy
  produces ``raw_surplus + redirect`` for all three consumers. We
  exercise it here in a regime where redirect is non-zero (forecast
  generous, battery_soc below the no-forecast SOC threshold), and
  assert the published, state-machine, and actuator views see the
  same number.

  Why this scenario is harness-only and not also a live test: the
  forecast and the live battery dynamics aren't repeatable. The
  scenario controls every input, so the redirect arithmetic is
  deterministic.

config:
  battery_capacity_kwh: 15.0
  battery_buffer_soc: 70
  battery_auto_start_soc: 90
  battery_priority_soc: 30
  battery_assist_floor_soc: 60
  ev_charging_mode: "auto"
  ev_min_current: 6
  ev_max_current: 16
  ev_phases: 3
  ev_voltage: 230
  daily_ev_target: 7.0
  ev_chargers:
    - id: "ev_charger"
      # Post #277 Phase C arch-rewrite: the authoritative user-intent
      # input is ``charge_mode`` (one of: off / solar_only /
      # min_plus_solar / solar_plus_cheap / always_max). The legacy
      # ``ev_charging_mode: "auto"`` is dead (dropped by the v6→v7
      # migration). Without an explicit charge_mode the harness
      # falls back to DEFAULT_EV_CHARGE_MODE="min_plus_solar" which
      # demands 4140W min before exiting IDLE — and these scenario
      # inputs (modest surplus) never reach that threshold.
      charge_mode: "solar_only"
      ev_charging_mode: "auto"
      daily_ev_target: 7.0

cycle_seconds: 30

# Steady-state regime. We're not testing ramp dynamics — we're testing
# that the budget arithmetic agrees across consumers — so a short flat
# timeline is enough.
timeline:
  - t: 0
    solar_power: 4000
    grid_power: 0     # neither import nor export — household is balanced
    battery_power: 2000  # +ve = charging at 2 kW
    battery_soc: 75       # Zone 3 (between buffer=70 and auto_start=90)
    ev_power: 0
    ev_connected: true

  - t: 60
    # Same conditions; cycle 2 confirms the budget is stable.

  - t: 120

  - t: 180

  - t: 240

expect:
  # Strategy MUST be solar_only — that's what triggers redirect in the
  # canonical method. SELF_CONSUMPTION (Z2) would skip redirect; the
  # decision logic for Z3 with generous forecast routes to solar_only.
  strategy_substring: "solar_only"

  # Canonical SOLAR_ONLY arithmetic with these inputs:
  #   raw_surplus = max(0, 4000 - 1500 - 2000) = 500
  #     (home is computed from the energy balance; with these inputs
  #     home ≈ 1500 W)
  #   battery_need_kwh = (100 - 75)/100 * 15 = 3.75 kWh
  #   forecast_remaining (default 0 in harness without explicit setup)
  #     → redirect uses the SOC threshold fallback. SOC=75 < 80, so
  #     redirect = 0.
  #   net_w = 500 W, current_a = floor(500/690) = 0.
  #
  # The unification gives us: actuator setpoint, state machine input,
  # and published `available_power` ALL = 500 W. Pre-Phase B they
  # could read 500 / >0 / 500 respectively, with the state machine
  # showing >0 because its `ev_budget` formula was different from
  # bare `available_power`.
  actuator_current_a:
    when_strategy: "solar_only"
    formula: "max(0, solar_power - home_consumption_power)"
    max_w_minus_margin: 200  # tight — no real noise in the synthetic trace
