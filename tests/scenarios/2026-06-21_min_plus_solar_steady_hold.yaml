name: "2026-06-21 min_plus_solar steady hold — commanded current must not flicker across 18 cycles"

coverage:
  - mode: min_plus_solar
    regime: surplus_at_floor
    issue: "EV current flicker / charger reverting mid-charge"

description: |
  Recorded from Guido's PROD on 2026-06-21: a KEBA charging in
  min_plus_solar with the surplus sitting near the 9 A floor. The user
  saw the car drop to ~120 W about once a minute and the offered current
  bounce 6↔9 A.

  That oscillation turned out to be a charger-side failsafe
  misconfiguration (SEM was setting a 6 A failsafe via a silently-failing
  set_failsafe call — fixed in beta.46), NOT a SEM decision flicker. This
  scenario pins the SEM-decision side of "smooth": with a steady surplus
  at/above the min floor, the canonical strategy and the commanded
  actuator current must hold — no per-cycle flips to IDLE or jumps in
  amps. If a future refactor re-introduces decision flicker (hidden
  state, hysteresis, a sliding window sensitive to micro-changes), this
  catches it on PR review.

  Surplus is set just above the 9 A × 3φ × 230 V = 6210 W floor so the
  charger holds at the minimum, exactly the PROD condition.

config:
  battery_capacity_kwh: 15.0
  battery_buffer_soc: 70
  battery_auto_start_soc: 90
  battery_priority_soc: 30
  ev_min_current: 9
  ev_max_current: 16
  ev_phases: 3
  ev_voltage: 230
  daily_ev_target: 10.0
  ev_chargers:
    - id: "ev_charger"
      charge_mode: "min_plus_solar"
      daily_ev_target: 10.0

cycle_seconds: 30

# 18 identical cycles (9 minutes) of steady surplus just above the floor.
# Sticky-timeline: t=0's readings carry forward to every later bare ``t``.
timeline:
  - t: 0
    solar_power: 7000
    grid_power: 6400        # exporting ~6.4 kW before the EV ramps
    battery_power: 0
    battery_soc: 99
    ev_power: 4300
    ev_connected: true
  - t: 30
  - t: 60
  - t: 90
  - t: 120
  - t: 150
  - t: 180
  - t: 210
  - t: 240
  - t: 270
  - t: 300
  - t: 330
  - t: 360
  - t: 390
  - t: 420
  - t: 450
  - t: 480
  - t: 510

expect:
  # Steady inputs → the charger keeps charging the whole run; it must NEVER
  # flip to idle (the "EV starts/stops" flicker the user feared). Steady
  # deterministic inputs → a steady command (the no-flicker invariant).
  strategy_not_substring: "idle"
  # NOTE: the old "never command above the solar surplus" ceiling was
  # REMOVED in #545 ("max out till self-consumption"). At SOC 99 (Zone 4)
  # min_plus_solar now deliberately commands ABOVE the solar surplus,
  # discharging the near-full battery into the car (up to the charger max),
  # so a surplus-ceiling actuator check no longer applies here.
