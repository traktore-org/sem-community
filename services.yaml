generate_dashboard:
  name: Generate SEM Dashboard
  description: >
    Generate and install the SEM v6.0 dashboard with 7 views:
    Home (system diagram + solar summary), Energy (Sankey + gauges),
    Battery (SOC zones), EV (session tracking), Control, Costs, System.

    Installs the SVG system diagram, registers the dashboard in the
    sidebar, and restarts HA to apply changes.
  fields:
    dashboard_title:
      name: Dashboard Title
      description: "Display name shown in sidebar"
      required: false
      default: "Solar Energy Management"
      example: "Solar Energy Management"
      selector:
        text:
    dashboard_path:
      name: Dashboard URL Path
      description: "URL path for the dashboard (lowercase, use dashes)"
      required: false
      default: "sem-dashboard"
      example: "sem-dashboard"
      selector:
        text:

sync_priorities_from_dashboard:
  name: Sync Priorities from Dashboard
  description: Automatically sync device priorities from dashboard card order (drag-and-drop)
  fields:
    dashboard_storage_key:
      name: Dashboard Storage Key
      description: Dashboard file name (default lovelace.dashboard_test)
      required: false
      default: "lovelace.dashboard_test"
      selector:
        text:
    view_path:
      name: View Path
      description: Dashboard view path containing device cards (default peak-load-management)
      required: false
      default: "peak-load-management"
      selector:
        text:

update_device_priorities:
  name: Update Device Priorities
  description: Batch update device priorities from drag-and-drop reorder in the load priority card.
  fields:
    priorities:
      name: Priorities
      description: "List of {device_id, priority} objects representing the new order"
      required: true
      selector:
        object:

update_device_config:
  name: Update Device Config
  description: Toggle a device property (controllable or critical status).
  fields:
    device_id:
      name: Device ID
      description: The device to update
      required: true
      selector:
        text:
    property:
      name: Property
      description: "Which property to change: 'controllable' or 'critical'"
      required: true
      selector:
        select:
          options:
            - controllable
            - critical
    value:
      name: Value
      description: New boolean value
      required: true
      selector:
        boolean:

update_target_peak:
  name: Update Target Peak
  description: Set the target peak limit for load management (kW).
  fields:
    target_peak_limit:
      name: Target Peak Limit
      description: New target peak limit in kW (1.0 – 80.0)
      required: true
      selector:
        number:
          min: 1.0
          max: 80.0
          step: 0.1
          unit_of_measurement: kW
    peak_limit_unlimited:
      name: No Grid Limit
      description: >-
        Explicit "no ceiling" opt-out (#716). Optional — omit to leave the
        stored flag untouched.
      required: false
      selector:
        boolean: {}

set_device_control_mapping:
  name: Set Device Control Mapping
  description: Manually map a control entity to an Energy Dashboard device when auto-discovery fails. The mapping is persisted and survives restarts.
  fields:
    energy_sensor:
      name: Energy Sensor
      description: "The energy sensor entity from the Energy Dashboard (e.g., sensor.heizband_energy)"
      required: true
      selector:
        entity:
          domain: sensor
    control_entity:
      name: Control Entity
      description: "The entity to use for control (e.g., switch.towelheater_men or number.keba_current). Required for switch, current, and input_boolean types; leave empty for the service type."
      required: false
      selector:
        entity:
    control_type:
      name: Control Type
      description: "How the device is controlled: switch (on/off), current (set amperage on a number entity), input_boolean (toggle), or service (call a service such as keba.set_current)"
      required: false
      default: "switch"
      selector:
        select:
          options:
            - switch
            - current
            - input_boolean
            - service
    service:
      name: Service
      description: "For control_type=service: the service to call (e.g., keba.set_current, easee.set_charger_max_limit)"
      required: false
      example: keba.set_current
      selector:
        text:
    param:
      name: Service Parameter
      description: "For control_type=service: the parameter name the service expects (default: current)"
      required: false
      default: "current"
      selector:
        text:
    shed_value:
      name: Shed Value
      description: "For control_type=service: the value to send when reducing/shedding the device (e.g., 0, or 6 for KEBA minimum)"
      required: false
      selector:
        number:
          min: 0
          max: 32
          mode: box
    restore_value:
      name: Restore Value
      description: "For control_type=service: the value to send when restoring the device (e.g., 16)"
      required: false
      selector:
        number:
          min: 0
          max: 32
          mode: box

remove_device_control_mapping:
  name: Remove Device Control Mapping
  description: Remove a manual control mapping from an Energy Dashboard device. The device reverts to auto-discovery (its auto-detected control, or none).
  fields:
    energy_sensor:
      name: Energy Sensor
      description: "The energy sensor entity whose manual mapping should be removed"
      required: true
      selector:
        entity:
          domain: sensor

register_surplus_device:
  name: Register Surplus Device
  description: Register a device (switch, relay, smart plug, or a climate.* air-conditioner / heat pump) for solar surplus control. One call is enough — the registration is persisted across restarts and the device defaults to surplus mode (SEM switches it on when surplus power is available, based on its priority). Returns a summary of the registered device.
  fields:
    device_id:
      name: Device ID
      description: Unique identifier for the device (e.g., "hot_water_relay")
      required: true
      selector:
        text:
    entity_id:
      name: Entity ID
      description: The entity to control — a switch/input_boolean, or a climate.* entity when Device Type is "climate" (e.g., "switch.shelly_hot_water" or "climate.living_room_ac").
      required: true
      selector:
        entity:
          domain:
            - switch
            - input_boolean
            - climate
    device_type:
      name: Device Type
      description: 'How SEM actuates the entity: switch (on/off via turn_on/off — the default) or climate (an AC / heat pump driven by hvac_mode + target temperature).'
      required: false
      default: switch
      selector:
        select:
          options:
            - switch
            - climate
    hvac_mode:
      name: HVAC Mode (climate only)
      description: For a climate device, the hvac_mode to set when SEM turns it ON (cool for an AC, heat/heat_cool for heating). Ignored for switch devices.
      required: false
      default: cool
      selector:
        select:
          options:
            - cool
            - heat
            - heat_cool
            - dry
            - fan_only
            - auto
    target_temperature:
      name: Target Temperature (climate only)
      description: For a climate device, the comfort target temperature to set when SEM turns it ON. Leave empty to keep the unit's current setpoint. Ignored for switch devices.
      required: false
      selector:
        number:
          min: 5
          max: 35
          step: 0.5
          unit_of_measurement: "°C"
    name:
      name: Display Name
      description: Friendly name for the device
      required: false
      selector:
        text:
    priority:
      name: Priority
      description: "Device priority (1=highest, 10=lowest). Lower priority devices get surplus first."
      required: false
      default: 5
      selector:
        number:
          min: 1
          max: 10
          step: 1
    rated_power:
      name: Rated Power (W)
      description: Device rated power consumption in watts
      required: false
      default: 1000
      selector:
        number:
          min: 100
          max: 20000
          unit_of_measurement: W
    power_entity_id:
      name: Power Sensor
      description: Optional power monitoring sensor for the device
      required: false
      selector:
        entity:
          domain: sensor
          device_class: power
    energy_entity_id:
      name: Energy Sensor (kWh)
      description: >-
        Optional cumulative energy counter (kWh) for a device with no power
        sensor (#600). SEM autodetects a companion power sensor first, else
        derives live power from this counter.
      required: false
      selector:
        entity:
          domain: sensor
          device_class: energy
    control_mode:
      name: Control Mode
      description: "How SEM controls the device: surplus (SEM switches it on solar surplus — the default), peak_only (your own automations run it, SEM only sheds it to protect the grid peak), off (monitor only)."
      required: false
      default: surplus
      selector:
        select:
          options:
            - surplus
            - peak_only
            - "off"
    daily_min_runtime_min:
      name: Min Runtime per Day
      description: Daily runtime floor in minutes (e.g. 240 = pool pump runs at least 4h/day). SEM prefers solar surplus; a device is never fully starved behind higher-priority siblings. Not a hard guarantee.
      required: false
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: min
    daily_max_runtime_min:
      name: Max Runtime per Day
      description: "(#620) Daily runtime CAP in minutes — the device never runs past this in a day (pump wear / waste). 0 = uncapped. Persisted across restarts."
      required: false
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: min
    battery_assist_enabled:
      name: Solar + battery (daytime assist)
      description: "(#620) Tier 1 — let the home battery assist this device above the Buffer SoC when there is real solar surplus (self-consumption max, like the EV). Automatic; does not drain stored house energy. Off = Solar only (battery reserved for the house)."
      required: false
      default: false
      selector:
        boolean:
    battery_eligible_overnight:
      name: Use battery overnight (below buffer)
      description: "(#620) Tier 2 — allow this device to draw the battery BELOW the buffer, down to the Reserve SoC, when there is no surplus (spends stored house energy at night). Off by default."
      required: false
      default: false
      selector:
        boolean:
    top_up_policy:
      name: Top-up Policy
      description: "What to do when solar surplus alone will not meet the target: solar_only (never grid power — accept missing the target on a dark day), cheap_hours (top up during cheap tariff windows)."
      required: false
      default: solar_only
      selector:
        select:
          options:
            - solar_only
            - cheap_hours
    stop_entity:
      name: Stop Condition Sensor
      description: Optional sensor that ends the device's day early (e.g. the car's SOC sensor).
      required: false
      selector:
        entity:
          domain: sensor
    stop_at:
      name: Stop Condition Value
      description: The device stops once the stop sensor reaches this value (e.g. 80 for 80% SOC).
      required: false
      selector:
        number:
          min: 0
          max: 100000

unregister_surplus_device:
  name: Unregister Surplus Device
  description: Remove a device previously registered with Register Surplus Device (also removes the persisted registration).
  fields:
    device_id:
      name: Device ID
      description: The device identifier used at registration
      required: true
      selector:
        text:

schedule_appliance:
  name: Schedule Appliance
  description: Schedule a household appliance (dishwasher, washer) to run before a deadline. The system will start it when solar surplus is available, or start from grid if the deadline approaches.
  fields:
    device_id:
      name: Device ID
      description: Unique identifier for the appliance (e.g., "dishwasher")
      required: true
      selector:
        text:
    entity_id:
      name: Entity ID
      description: The switch entity to start the appliance
      required: true
      selector:
        entity:
          domain: switch
    deadline:
      name: Deadline
      description: "When the appliance must finish (ISO format, e.g., '2026-03-19T18:00:00')"
      required: true
      selector:
        text:
    name:
      name: Display Name
      description: Friendly name for the appliance
      required: false
      selector:
        text:
    estimated_runtime_minutes:
      name: Estimated Runtime (minutes)
      description: How long the appliance typically runs
      required: false
      default: 120
      selector:
        number:
          min: 15
          max: 480
          unit_of_measurement: min
    estimated_energy_kwh:
      name: Estimated Energy (kWh)
      description: How much energy the appliance typically uses
      required: false
      default: 1.0
      selector:
        number:
          min: 0.1
          max: 10
          step: 0.1
          unit_of_measurement: kWh
    rated_power:
      name: Rated Power (W)
      description: Appliance rated power consumption
      required: false
      default: 1000
      selector:
        number:
          min: 100
          max: 5000
          unit_of_measurement: W
    priority:
      name: Priority
      description: "Scheduling priority (1=highest, 10=lowest)"
      required: false
      default: 7
      selector:
        number:
          min: 1
          max: 10
          step: 1

cancel_appliance_schedule:
  name: Cancel Appliance Schedule
  description: Cancel a pending appliance schedule created with schedule_appliance. The appliance is released from surplus control and will not be force-started at its deadline.
  fields:
    device_id:
      name: Device ID
      description: The identifier used when the appliance was scheduled (e.g., "dishwasher")
      required: true
      selector:
        text:

reset_sign_detection:
  name: Reset sign detection
  description: >
    Forget the learned grid and battery sign-convention locks (RAM and
    storage) and re-learn them from the Energy Dashboard counters. Use
    this if grid import/export or battery charge/discharge are showing
    flipped after the autodetect locked a wrong sign — the lock now
    persists across restarts (#476), so a restart alone no longer
    clears it.
  fields:
    entry_id:
      name: Config entry
      description: "SEM config entry id (only needed with multiple SEM entries)"
      required: false
      selector:
        text:

flip_grid_sign:
  name: Flip grid sign
  description: >
    Flip the grid import/export convention by one tap and return a
    support report. Toggles the persisted grid_sign_user_flip override
    (sits on top of the auto/manual decision), reloads so the corrected
    sign takes effect immediately, and returns a diagnostics payload
    (raw meter value, configured counters, correlation evidence) that the
    Control-tab button copies for a GitHub issue. Use when import/export
    appears inverted and a re-learn can't fix it (e.g. a swapped or
    net-only meter). Calling it again flips back.
  fields:
    entry_id:
      name: Config entry
      description: "SEM config entry id (only needed with multiple SEM entries)"
      required: false
      selector:
        text:

flip_battery_sign:
  name: Flip battery sign
  description: >
    Flip the battery charge/discharge convention by one tap and return a
    support report. Toggles the persisted battery_sign_user_flip override
    (sits on top of the auto-detect / brand-seed decision), reloads so the
    corrected sign takes effect immediately, and returns a diagnostics
    payload (raw battery value, configured counters, accumulator evidence)
    that the Config-tab button copies for a GitHub issue. Use when battery
    charge/discharge appears inverted and a re-learn can't fix it.
    Calling it again flips back.
  fields:
    entry_id:
      name: Config entry
      description: "SEM config entry id (only needed with multiple SEM entries)"
      required: false
      selector:
        text:

# --- #673: these four were registered in __init__.py but missing here for
# releases. An undeclared service is still callable, so nothing errored — it
# just lost its whole UI affordance (no description, no field pickers, no
# validation in Developer Tools → Actions). Worst for `diagnose`, which
# docs/SEM_TRACE.md explicitly tells users to call. Guarded by
# tests/test_673_services_declared.py.

diagnose:
  name: Diagnose
  description: >
    Return SEM's current configuration, live state and recent log lines for
    one area, as a service response. This is the "what does SEM actually
    think right now" tool — use it before filing an issue, and paste the
    result in.

    Read-only. Never changes configuration or touches hardware.
  fields:
    section:
      name: Section
      description: >
        Which area to report on. "all" returns the overview; "trace" returns
        the layered per-cycle decision chain (management → process →
        integration) plus any layer-boundary mismatch, which is the fastest
        way to explain an unexpected EV or load decision.
      required: false
      default: "all"
      example: "trace"
      selector:
        select:
          mode: dropdown
          options:
            - "all"
            - "trace"
            - "ev_chargers"
            - "battery_zones"
            - "battery_scheduler"
            - "heat_pump"
            - "hot_water"
            - "tariff"
            - "load_management"
            - "forecast"
            - "notifications"
            - "advanced"

remove_charger:
  name: Remove EV Charger
  description: >
    Remove an EV charger from SEM by id. `update_device_config` merges the
    charger list additively (so adding one never drops its siblings), which
    means it cannot express a removal — this service can.
  fields:
    charger_id:
      name: Charger ID
      description: "The id of the charger to remove, as shown on its dashboard card"
      required: true
      example: "ev_charger"
      selector:
        text:
    entry_id:
      name: Config Entry ID
      description: "Only needed if you run more than one SEM config entry"
      required: false
      selector:
        text:

get_config:
  name: Get Configuration
  description: >
    Return SEM's merged configuration (setup data + options) as a service
    response. Home Assistant's own `config_entries/get` strips both for
    security, so this is the only way to read back option-only fields.

    Used by the dashboard's Configuration tab. Read-only.
  fields:
    entry_id:
      name: Config Entry ID
      description: "Only needed if you run more than one SEM config entry"
      required: false
      selector:
        text:

set_option:
  name: Set Configuration Option
  description: >
    Write one or more configuration options, merging them into the SEM
    config entry exactly as the Options flow does.

    Used by the dashboard's Configuration tab. Prefer the UI — this service
    does not validate the way the config flow does, and an unknown key is
    stored rather than rejected.
  fields:
    options:
      name: Options
      description: "Mapping of option key to value"
      required: true
      example: '{"battery_priority_soc": 30}'
      selector:
        object:
    entry_id:
      name: Config Entry ID
      description: "Only needed if you run more than one SEM config entry"
      required: false
      selector:
        text:
