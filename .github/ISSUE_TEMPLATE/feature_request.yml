name: Feature Request
description: Suggest a new feature for SEM
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case, not just the solution.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like this to work?
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - EV Charging
        - Battery Management
        - Dashboard
        - Notifications
        - Tariff / Cost Tracking
        - Hardware Support
        - Localization
        - Other
  - type: markdown
    attributes:
      value: |
        ---
        💛 **Love SEM and want to help an idea land sooner?**
        SEM is built and maintained by one person. A [**monthly sponsorship**](https://github.com/sponsors/traktore-org)
        keeps development sustainable and helps prioritise community feature requests like this one.
        Every tier is appreciated — thank you for supporting the project!
