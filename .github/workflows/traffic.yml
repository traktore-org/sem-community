name: Traffic Stats

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Collect and update stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p stats

          gh api repos/${{ github.repository }}/traffic/clones > /tmp/clones.json
          gh api repos/${{ github.repository }}/traffic/views > /tmp/views.json

          python3 << 'PYEOF'
          import json, os
          from datetime import datetime

          if os.path.exists('stats/traffic.json'):
              with open('stats/traffic.json') as f:
                  data = json.load(f)
          else:
              data = {"total_unique_clones": 0, "total_clones": 0, "total_unique_views": 0, "total_views": 0, "daily": [], "last_updated": ""}

          with open('/tmp/clones.json') as f:
              clones = json.load(f)
          with open('/tmp/views.json') as f:
              views = json.load(f)

          existing_dates = {d["date"] for d in data.get("daily", [])}

          clone_by_date = {c["timestamp"][:10]: c for c in clones.get("clones", [])}
          view_by_date = {v["timestamp"][:10]: v for v in views.get("views", [])}
          all_dates = sorted(set(list(clone_by_date.keys()) + list(view_by_date.keys())))

          new_entries = 0
          for date in all_dates:
              if date in existing_dates:
                  continue
              c = clone_by_date.get(date, {})
              v = view_by_date.get(date, {})
              entry = {
                  "date": date,
                  "clones": c.get("count", 0),
                  "unique_clones": c.get("uniques", 0),
                  "views": v.get("count", 0),
                  "unique_views": v.get("uniques", 0),
              }
              data["daily"].append(entry)
              data["total_clones"] += entry["clones"]
              data["total_unique_clones"] += entry["unique_clones"]
              data["total_views"] += entry["views"]
              data["total_unique_views"] += entry["unique_views"]
              new_entries += 1

          data["daily"].sort(key=lambda x: x["date"])
          data["last_updated"] = datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ")

          with open("stats/traffic.json", "w") as f:
              json.dump(data, f, indent=2)

          print(f"Added {new_entries} new entries. Total unique clones: {data['total_unique_clones']}, Total unique views: {data['total_unique_views']}")
          PYEOF

      - name: Commit stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats/traffic.json
          git diff --cached --quiet || (git commit -m "Update traffic stats [skip ci]" && git push)
