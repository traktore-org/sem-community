# SEM Integration Quality Scale Compliance
# Tracked against: https://developers.home-assistant.io/docs/core/integration-quality-scale/
# Last audited: 2026-05-10 (v1.5.0)

rules:
  # ============================================================
  # Bronze (19 rules)
  # ============================================================
  action-setup: done
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # ============================================================
  # Silver (10 rules)
  # ============================================================
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: |
      Local polling integration (iot_class: local_polling) with no
      authentication credentials. No re-auth flow needed.
  test-coverage: done

  # ============================================================
  # Gold (22 rules)
  # ============================================================
  devices: done
  diagnostics: done
  discovery-update-info: done
  discovery: done
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices: done

  # ============================================================
  # Platinum (3 rules)
  # ============================================================
  async-dependency:
    status: done
    comment: |
      No third-party requirements. All file I/O wrapped in
      hass.async_add_executor_job(). No blocking calls in async context.
  inject-websession:
    status: exempt
    comment: |
      Integration makes no outbound HTTP requests. Forecast data is read
      from HA entity states (Solcast/Forecast.Solar provide their own sensors).
  strict-typing:
    status: done
    comment: |
      py.typed marker present. SEMConfigEntry type alias used in all platform
      files. from __future__ import annotations in all modules.
